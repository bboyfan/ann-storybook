<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{STORY_TITLE}}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #14110F;
      color: #EDE4D7;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-x: none;
    }
    .sentence-item {
      transition: background-color 0.2s ease, color 0.2s ease;
      border-radius: 0.75rem;
      padding: 0.35rem 0.6rem;
      margin: 0 -0.4rem;
      cursor: pointer;
    }
    .sentence-active {
      background: rgba(245, 158, 11, 0.18);
      color: #FDE68A;
    }
    .edge-nav-btn { opacity: 0.55; transition: opacity 0.2s ease, transform 0.15s ease; }
    .edge-nav-btn:active { opacity: 0.95; transform: scale(0.92); }
    .edge-nav-btn:disabled { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="min-h-screen bg-[#14110F] text-[#EDE4D7] flex flex-col items-center justify-start px-2.5 pt-2 pb-16 sm:px-4 sm:py-4 select-none">
  <main id="storybookMain" class="w-full max-w-md flex flex-col gap-2.5">
    <div id="illustrationBox" class="relative w-full aspect-[3/4] max-h-[58vh] sm:max-h-[62vh] rounded-3xl overflow-hidden shadow-2xl border border-[#2E2621] bg-[#1C1714]">
      <img id="pageImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="繪本插圖" class="w-full h-full object-cover block select-none pointer-events-none">
      <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/55 via-black/15 to-transparent pointer-events-none"></div>
      <div class="absolute top-3 left-3 z-10 flex items-center gap-2 pointer-events-none">
        <span id="pageBadge" class="bg-black/45 backdrop-blur-md text-[#EDE4D7]/90 text-xs font-medium px-2.5 py-1 rounded-full border border-white/10 tabular-nums">1 / 10</span>
        <div id="readingIndicator" class="hidden bg-black/60 backdrop-blur-md text-amber-300 text-xs font-medium px-2.5 py-1 rounded-full border border-amber-400/30 flex items-center gap-1.5">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
          <span id="readingIndicatorText">朗讀中</span>
        </div>
      </div>
      <button id="prevPageBtn" type="button" aria-label="上一頁" class="edge-nav-btn absolute inset-y-12 left-0 w-14 z-10 flex items-center justify-start pl-2 focus:outline-none">
        <span class="w-7 h-7 rounded-full bg-black/35 backdrop-blur-sm border border-white/15 text-white/85 flex items-center justify-center text-sm">‹</span>
      </button>
      <button id="nextPageBtn" type="button" aria-label="下一頁" class="edge-nav-btn absolute inset-y-12 right-0 w-14 z-10 flex items-center justify-end pr-2 focus:outline-none">
        <span class="w-7 h-7 rounded-full bg-black/35 backdrop-blur-sm border border-white/15 text-white/85 flex items-center justify-center text-sm">›</span>
      </button>
      <div class="absolute bottom-3 right-3 z-20 flex items-center gap-2">
        <button id="quickModeBtn" type="button" class="h-9 px-2.5 rounded-full bg-black/55 hover:bg-black/75 active:scale-95 backdrop-blur-md text-[#EDE4D7] border border-white/15 flex items-center gap-1 text-[11px] shadow-lg transition" title="切換 Leda AI 語音 / 內建秒播語音">
          <span id="quickModeLabel">✨ AI語音</span>
        </button>
        <button id="voiceInfoBtn" type="button" class="w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 active:scale-95 backdrop-blur-md text-[#EDE4D7] border border-white/15 flex items-center justify-center text-sm shadow-lg transition" title="語音與爸媽錄音設定">🎙️</button>
        <button id="playToggleBtn" type="button" class="bg-amber-400/95 hover:bg-amber-300 active:scale-95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md">
          <span id="playToggleIcon">🔊</span>
          <span id="playToggleLabel">念故事</span>
        </button>
      </div>
    </div>

    <section id="storyTextCard" class="bg-[#1F1A16] rounded-3xl px-5 py-4 border border-[#2E2621] shadow-inner">
      <h2 id="pageTitle" class="sr-only"></h2>
      <div id="storySentences" class="text-[17px] sm:text-[19px] leading-[1.7] text-[#EDE4D7] space-y-2 font-normal"></div>
      <div class="mt-2.5 pt-2 border-t border-[#2E2621]/60 flex items-center justify-between text-[11px] text-[#9E9183]">
        <span id="statusHint">左右滑動翻頁・點文字可從該段朗讀</span>
        <span id="cacheDot" class="text-[#9E9183]"></span>
      </div>
    </section>
    <audio id="geminiAudioPlayer" preload="auto" playsinline class="hidden"></audio>
  </main>

  <div id="voiceModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#1F1A16] border border-[#382E28] rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 my-4 text-[#EDE4D7]">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-amber-200">🎙️ 故事語音與爸媽錄音</h3>
        <button id="closeVoiceModalBtn" type="button" class="text-[#9E9183] hover:text-white text-lg font-bold px-2">✕</button>
      </div>
      <div class="space-y-3.5 text-sm leading-relaxed">
        <div class="bg-[#29221D] rounded-2xl p-3.5 border border-[#382E28] space-y-2">
          <div class="flex items-center justify-between">
            <label for="engineSelect" class="font-semibold text-amber-200 text-xs sm:text-sm">朗讀模式：</label>
            <select id="engineSelect" class="bg-[#181411] text-[#EDE4D7] text-xs rounded-xl px-2.5 py-1.5 border border-[#473B33] focus:outline-none">
              <option value="gemini-tts">✨ Leda 柔和甜美台灣語音</option>
              <option value="web-speech">⚡ 內建台灣語音（0秒秒播）</option>
              <option value="parent-record">❤️ 優先播放爸媽錄音</option>
            </select>
          </div>
          <p class="text-[11px] text-[#B5A899]">預設採用 Leda 溫柔台灣語音朗讀；亦可切換內建秒播或錄下爸媽的聲音。</p>
        </div>
        <div class="bg-[#29221D] rounded-2xl p-3.5 border border-[#382E28] space-y-2">
          <p class="font-semibold text-amber-200 text-xs sm:text-sm">❤️ 為「第 <span id="recordPageNumLabel">1</span> 頁」錄下爸媽聲音：</p>
          <div class="flex gap-2">
            <button id="recordBtn" type="button" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition">⏺️ 開始錄音</button>
            <label class="flex-1 bg-[#382E28] hover:bg-[#473B33] text-[#EDE4D7] text-xs font-semibold py-2 px-3 rounded-xl text-center cursor-pointer transition">
              📂 匯入音檔
              <input id="uploadAudioInput" type="file" accept="audio/*" class="hidden">
            </label>
          </div>
          <p id="recordStatusText" class="text-[11px] text-emerald-300/90">錄音或匯入後，本頁會自動優先播放您的聲音。</p>
        </div>
        <details class="bg-[#241E1A] rounded-2xl px-3.5 py-2.5 border border-[#332A24] text-xs text-[#B5A899]">
          <summary class="cursor-pointer font-medium text-[#D1C5B7] select-none">進階選項（下載音檔 / 外部金鑰）</summary>
          <div class="mt-3 space-y-3 pt-2 border-t border-[#332A24]">
            <div class="flex items-center justify-between">
              <span>下載本頁 Leda 語音檔：</span>
              <button id="downloadWavBtn" type="button" class="bg-[#382E28] hover:bg-[#473B33] text-amber-200 font-semibold px-2.5 py-1 rounded-lg border border-[#4D3F37]">⬇️ 下載 .wav</button>
            </div>
            <div>
              <label for="customApiKeyInput" class="block mb-1">選填 Gemini API Key（Canvas 內免填）：</label>
              <input id="customApiKeyInput" type="password" placeholder="預設自動帶入憑證" class="w-full bg-[#181411] text-[#EDE4D7] text-xs rounded-lg px-2.5 py-1.5 border border-[#382E28] focus:outline-none">
            </div>
          </div>
        </details>
      </div>
      <div class="flex gap-2 pt-1">
        <button id="testVoiceBtn" type="button" class="flex-1 bg-amber-400 hover:bg-amber-300 text-[#1C1714] font-bold py-2.5 px-4 rounded-xl text-sm transition">🔊 試聽聲音</button>
        <button id="confirmVoiceModalBtn" type="button" class="bg-[#2E2621] hover:bg-[#382E28] text-[#EDE4D7] font-semibold py-2.5 px-5 rounded-xl border border-[#473B33] text-sm transition">完成</button>
      </div>
    </div>
  </div>

  <script>
    const apiKey = "";
    const VOICE_NAME = "Leda";
    const PAGES = __PAGES_JSON_PLACEHOLDER__;

    let currentPageIndex = 0;
    let currentSentenceIndex = -1;
    let isReading = false;
    let isGeneratingAudio = false;
    let isAutoBedtime = true;
    let selectedEngine = "gemini-tts";
    let bestTaiwanVoice = null;
    let keepAliveInterval = null;
    let nextSentenceTimeout = null;
    let preloadDebounceTimer = null;
    let sentenceHighlightTimers = [];
    let readSessionId = 0;

    const geminiPcmCache = {};
    const inflightRequests = {};
    const parentAudioCache = {};
    let ttsQueueChain = Promise.resolve();
    let ttsCooldownUntil = 0;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecordingNow = false;

    window._activeBedtimeUtterance = null;
    window._bedtimeAudioCtx = null;
    window._activeAudioSource = null;
    window._htmlAudioUnlocked = false;

    const $ = (id) => document.getElementById(id);
    const storybookMain = $("storybookMain"), pageBadge = $("pageBadge"), pageImage = $("pageImage"),
          pageTitle = $("pageTitle"), storySentences = $("storySentences"), statusHint = $("statusHint"),
          cacheDot = $("cacheDot"), readingIndicator = $("readingIndicator"), readingIndicatorText = $("readingIndicatorText"),
          playToggleBtn = $("playToggleBtn"), playToggleIcon = $("playToggleIcon"), playToggleLabel = $("playToggleLabel"),
          prevPageBtn = $("prevPageBtn"), nextPageBtn = $("nextPageBtn"), quickModeBtn = $("quickModeBtn"),
          quickModeLabel = $("quickModeLabel"), voiceInfoBtn = $("voiceInfoBtn"), voiceModal = $("voiceModal"),
          closeVoiceModalBtn = $("closeVoiceModalBtn"), confirmVoiceModalBtn = $("confirmVoiceModalBtn"),
          engineSelect = $("engineSelect"), customApiKeyInput = $("customApiKeyInput"),
          downloadWavBtn = $("downloadWavBtn"), recordPageNumLabel = $("recordPageNumLabel"), recordBtn = $("recordBtn"),
          uploadAudioInput = $("uploadAudioInput"), recordStatusText = $("recordStatusText"),
          testVoiceBtn = $("testVoiceBtn"), geminiAudioPlayer = $("geminiAudioPlayer");

    function unlockAudioOnUserGesture() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          if (!window._bedtimeAudioCtx) window._bedtimeAudioCtx = new AC();
          if (window._bedtimeAudioCtx.state === "suspended") window._bedtimeAudioCtx.resume().catch(() => {});
          const silentBuf = window._bedtimeAudioCtx.createBuffer(1, 1, 22050);
          const silentSrc = window._bedtimeAudioCtx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(window._bedtimeAudioCtx.destination);
          silentSrc.start(0);
        }
      } catch (e) {}
      if (!window._htmlAudioUnlocked && geminiAudioPlayer) {
        try {
          geminiAudioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
          const p = geminiAudioPlayer.play();
          if (p && typeof p.then === "function") {
            p.then(() => { geminiAudioPlayer.pause(); geminiAudioPlayer.currentTime = 0; window._htmlAudioUnlocked = true; }).catch(() => {});
          }
        } catch (e) {}
      }
    }

    function pcm16BinaryToWavBlobUrl(binaryString, sampleRate = 24000, numChannels = 1) {
      const dataSize = binaryString.length;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF"); view.setUint32(4, 36 + dataSize, true); writeStr(8, "WAVE"); writeStr(12, "fmt ");
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true); view.setUint16(34, 16, true); writeStr(36, "data");
      view.setUint32(40, dataSize, true);
      const bytes = new Uint8Array(buffer, 44);
      for (let i = 0; i < dataSize; i++) bytes[i] = binaryString.charCodeAt(i);
      return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
    }

    function fetchGeminiTtsPage(pageIdx, customText = null, uiWaitMs = 12000) {
      const cacheKey = customText ? `custom_${customText}` : `page_${pageIdx}`;
      if (geminiPcmCache[cacheKey]) return Promise.resolve(geminiPcmCache[cacheKey]);
      if (Date.now() < ttsCooldownUntil) return Promise.reject(new Error("TTS cooldown active"));

      if (!inflightRequests[cacheKey]) {
        const networkJob = () => (async () => {
          if (geminiPcmCache[cacheKey]) return geminiPcmCache[cacheKey];
          const customKey = (customApiKeyInput && customApiKeyInput.value.trim()) ? customApiKeyInput.value.trim() : "";
          const activeKey = customKey || apiKey || "";
          const baseUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent";
          const endpoint = activeKey ? `${baseUrl}?key=${encodeURIComponent(activeKey)}` : baseUrl;
          const rawText = customText || (PAGES[pageIdx]?.sentences || []).join("，");
          const payload = {
            contents: [{ parts: [{ text: `台灣溫柔甜美故事姊姊語氣朗讀：${rawText}` }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: VOICE_NAME } } }
            }
          };

          const resp = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!resp.ok) {
            if (resp.status === 429 || resp.status === 503) ttsCooldownUntil = Date.now() + 12000;
            throw new Error(`HTTP ${resp.status}`);
          }
          const data = await resp.json();
          const audioPart = (data?.candidates?.[0]?.content?.parts || []).find(p => p.inlineData && p.inlineData.data);
          if (!audioPart || audioPart.inlineData.data.length < 150) throw new Error("Empty audio");

          let sampleRate = 24000;
          const m = (audioPart.inlineData.mimeType || "").match(/rate=(\d+)/);
          if (m) sampleRate = parseInt(m[1], 10);

          const binaryString = window.atob(audioPart.inlineData.data);
          const durationSec = Math.floor(binaryString.length / 2) / sampleRate;
          const wavBlobUrl = pcm16BinaryToWavBlobUrl(binaryString, sampleRate, 1);
          const resultObj = { base64Data: audioPart.inlineData.data, sampleRate, durationSec, wavBlobUrl };
          geminiPcmCache[cacheKey] = resultObj;
          updateCacheHint();
          return resultObj;
        })();

        const queuedPromise = ttsQueueChain.then(networkJob, networkJob);
        ttsQueueChain = queuedPromise.catch(() => {});
        inflightRequests[cacheKey] = queuedPromise;
        queuedPromise.finally(() => { delete inflightRequests[cacheKey]; updateCacheHint(); });
        updateCacheHint();
      }

      let timerId = null;
      const uiTimeout = new Promise((_, reject) => {
        timerId = setTimeout(() => reject(new Error("UI wait timeout")), uiWaitMs);
      });
      return Promise.race([inflightRequests[cacheKey], uiTimeout]).finally(() => clearTimeout(timerId));
    }

    function scheduleBackgroundPreload(pageIdx) {
      if (selectedEngine !== "gemini-tts") return;
      if (pageIdx < 0 || pageIdx >= PAGES.length) return;
      if (PAGES[pageIdx]?.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) return;
      const cacheKey = `page_${pageIdx}`;
      if (geminiPcmCache[cacheKey] || inflightRequests[cacheKey]) return;
      if (preloadDebounceTimer) clearTimeout(preloadDebounceTimer);
      preloadDebounceTimer = setTimeout(() => {
        fetchGeminiTtsPage(pageIdx).catch(() => {});
      }, 450);
    }

    function getSentenceFractions(sentences) {
      if (!sentences || !sentences.length) return [0];
      const lengths = sentences.map(s => Math.max(1, s.replace(/\s+/g, "").length));
      const total = lengths.reduce((a, b) => a + b, 0);
      const fractions = [0];
      let accum = 0;
      for (let i = 0; i < lengths.length; i++) { accum += lengths[i]; fractions.push(accum / total); }
      return fractions;
    }

    function clearHighlightTimers() {
      sentenceHighlightTimers.forEach(id => clearTimeout(id));
      sentenceHighlightTimers = [];
    }

    function scheduleSentenceHighlights(sentences, totalDurationSec, startIdx, startOffsetSec, mySession) {
      clearHighlightTimers();
      highlightSentence(startIdx);
      if (!sentences || sentences.length <= 1 || totalDurationSec <= 0) return;
      const fractions = getSentenceFractions(sentences);
      for (let j = startIdx + 1; j < sentences.length; j++) {
        const delayMs = Math.max(0, (totalDurationSec * fractions[j] - startOffsetSec) * 1000);
        sentenceHighlightTimers.push(setTimeout(() => {
          if (isReading && mySession === readSessionId) highlightSentence(j);
        }, delayMs));
      }
    }

    function playPcmViaWebAudio(ttsData, startOffsetSec, mySession, onFinishedCallback) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!window._bedtimeAudioCtx && AC) window._bedtimeAudioCtx = new AC();
        const ctx = window._bedtimeAudioCtx;
        if (!ctx) return false;
        if (ctx.state === "suspended") ctx.resume().catch(() => {});

        const binaryString = window.atob(ttsData.base64Data);
        const numSamples = Math.floor(binaryString.length / 2);
        if (numSamples < 80) return false;

        const audioBuffer = ctx.createBuffer(1, numSamples, ttsData.sampleRate || 24000);
        const channelData = audioBuffer.getChannelData(0);
        for (let i = 0; i < numSamples; i++) {
          let sample = (binaryString.charCodeAt(i * 2 + 1) << 8) | binaryString.charCodeAt(i * 2);
          if (sample >= 0x8000) sample -= 0x10000;
          channelData[i] = Math.max(-1, Math.min(1, (sample / 32768.0) * 1.15));
        }

        stopActiveWebAudioSource();
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        window._activeAudioSource = source;
        source.onended = () => {
          if (window._activeAudioSource === source) window._activeAudioSource = null;
          if (mySession === readSessionId && isReading && onFinishedCallback) onFinishedCallback();
        };
        source.start(0, Math.min(Math.max(0, startOffsetSec || 0), Math.max(0, audioBuffer.duration - 0.05)));
        return true;
      } catch (e) { return false; }
    }

    function stopActiveWebAudioSource() {
      if (window._activeAudioSource) {
        try { window._activeAudioSource.onended = null; window._activeAudioSource.stop(); window._activeAudioSource.disconnect(); } catch (e) {}
        window._activeAudioSource = null;
      }
    }

    function syncQuickModeUI() {
      if (!quickModeLabel) return;
      if (selectedEngine === "web-speech") {
        quickModeLabel.textContent = "⚡ 內建秒播";
      } else if (selectedEngine === "parent-record") {
        quickModeLabel.textContent = "❤️ 爸媽語音";
      } else {
        quickModeLabel.textContent = "✨ AI語音";
      }
      if (engineSelect && engineSelect.value !== selectedEngine) engineSelect.value = selectedEngine;
    }

    function updateCacheHint() {
      syncQuickModeUI();
      const pageKey = `page_${currentPageIndex}`;
      if (!cacheDot) return;
      if (parentAudioCache[currentPageIndex]) {
        cacheDot.textContent = "❤️ 爸媽錄音已就緒";
      } else if (PAGES[currentPageIndex]?.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) {
        cacheDot.textContent = "✨ 台灣自然語音已內嵌（秒播）";
      } else if (selectedEngine === "web-speech") {
        cacheDot.textContent = "⚡ 內建台灣語音（0秒即念）";
      } else if (geminiPcmCache[pageKey]) {
        cacheDot.textContent = "✨ 本頁 Leda 語音已就緒（秒播）";
      } else if (inflightRequests[pageKey]) {
        cacheDot.textContent = "⏳ 背景預載 Leda 語音中...";
      } else {
        cacheDot.textContent = "";
      }
    }

    function scoreTaiwanVoice(v) {
      const combined = ((v.lang || "") + " " + (v.name || "")).toLowerCase().replace("_", "-");
      if (!/zh|cmn|chinese|taiwan|國語|臺灣|台灣|美佳|mei-jia|hsiao|yunjhe/i.test(combined)) return -100;
      let s = 0;
      if (/zh-tw|hant-tw|taiwan|臺灣|台灣|美佳|mei-jia|hsiaochen|hsiaoyu|yunjhe|曉臻|曉雨|允哲/i.test(combined)) s += 100;
      else if (/hant|hk/i.test(combined)) s += 10;
      else s -= 50;
      if (/natural|neural|online|premium|enhanced|siri|優化|高音質|增強/i.test(combined)) s += 45;
      if (/hsiaochen|hsiaoyu|mei-jia|美佳|曉臻|曉雨|google 國語/i.test(combined)) s += 25;
      if (!v.localService) s += 10;
      return s;
    }

    function refreshVoices() {
      if (!("speechSynthesis" in window)) return;
      const raw = window.speechSynthesis.getVoices() || [];
      if (!raw.length) return;
      const scored = raw.map(v => ({ voice: v, score: scoreTaiwanVoice(v) })).filter(x => x.score > -50).sort((a, b) => b.score - a.score);
      bestTaiwanVoice = scored.length > 0 ? scored[0].voice : null;
    }

    if ("speechSynthesis" in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function cleanTextForTTS(text) {
      return text.replace(/——+/g, "，").replace(/……+/g, "，").replace(/[「」『』【】]/g, " ").replace(/\s+/g, " ").trim();
    }

    function renderPage() {
      const p = PAGES[currentPageIndex];
      pageBadge.textContent = p.badge || `${currentPageIndex + 1} / ${PAGES.length}`;
      pageImage.src = p.img;
      pageImage.alt = p.title || `第 ${currentPageIndex + 1} 頁插圖`;
      pageTitle.textContent = p.title || "";
      if (recordPageNumLabel) recordPageNumLabel.textContent = String(p.pageNum || (currentPageIndex + 1));

      storySentences.innerHTML = "";
      p.sentences.forEach((sentence, idx) => {
        const pEl = document.createElement("p");
        pEl.className = "sentence-item" + (idx === currentSentenceIndex ? " sentence-active" : "");
        pEl.textContent = sentence;
        pEl.addEventListener("click", () => { unlockAudioOnUserGesture(); startReadingPage(idx, true); });
        storySentences.appendChild(pEl);
      });

      prevPageBtn.disabled = currentPageIndex === 0;
      nextPageBtn.disabled = currentPageIndex === PAGES.length - 1;
      recordStatusText.textContent = parentAudioCache[currentPageIndex]
        ? `✅ 第 ${currentPageIndex + 1} 頁已儲存爸媽專屬語音！`
        : "錄音或匯入後，本頁會自動優先播放您的聲音。";
      updateCacheHint();
    }

    function highlightSentence(idx) {
      currentSentenceIndex = idx;
      storySentences.querySelectorAll(".sentence-item").forEach((el, i) => {
        el.classList.toggle("sentence-active", idx === -2 || i === idx);
      });
    }

    function syncControlButtons() {
      if (isReading) {
        readingIndicator.classList.remove("hidden");
        if (isGeneratingAudio) {
          readingIndicatorText.textContent = "Leda 語音準備中（點左鈕可秒播）";
          playToggleIcon.textContent = "⏳";
          playToggleLabel.textContent = "讀取中";
          playToggleBtn.className = "bg-amber-300/95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        } else {
          readingIndicatorText.textContent = "朗讀中";
          playToggleIcon.textContent = "⏹";
          playToggleLabel.textContent = "停止";
          playToggleBtn.className = "bg-rose-500/95 hover:bg-rose-400 active:scale-95 text-white font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        }
      } else {
        readingIndicator.classList.add("hidden");
        playToggleIcon.textContent = "🔊";
        playToggleLabel.textContent = "念故事";
        playToggleBtn.className = "bg-amber-400/95 hover:bg-amber-300 active:scale-95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        updateCacheHint();
      }
    }

    function clearTimers() {
      if (keepAliveInterval) { clearInterval(keepAliveInterval); keepAliveInterval = null; }
      if (nextSentenceTimeout) { clearTimeout(nextSentenceTimeout); nextSentenceTimeout = null; }
      clearHighlightTimers();
    }

    function stopReading() {
      readSessionId++;
      isReading = false;
      isGeneratingAudio = false;
      clearTimers();
      window._activeBedtimeUtterance = null;
      stopActiveWebAudioSource();
      try { geminiAudioPlayer.pause(); geminiAudioPlayer.currentTime = 0; } catch (e) {}
      if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
      highlightSentence(-1);
      syncControlButtons();
    }

    function handlePageFinished(mySession) {
      if (!isReading || mySession !== readSessionId) return;
      clearHighlightTimers();
      if (isAutoBedtime && currentPageIndex < PAGES.length - 1) {
        nextSentenceTimeout = setTimeout(() => {
          if (!isReading || mySession !== readSessionId) return;
          currentPageIndex++;
          highlightSentence(-1);
          renderPage();
          syncControlButtons();
          startReadingPage(0, true, mySession);
        }, 550);
      } else {
        isReading = false;
        isGeneratingAudio = false;
        clearTimers();
        highlightSentence(-1);
        syncControlButtons();
        if (statusHint) statusHint.textContent = currentPageIndex === PAGES.length - 1 ? "🌙 故事聽完囉，晚安！" : "左右滑動翻頁・點文字可從該段朗讀";
      }
    }

    function playAudioElementUrl(blobUrl, startOffsetSec, mySession, onEndedCallback) {
      if (!isReading || mySession !== readSessionId) return;
      isGeneratingAudio = false;
      syncControlButtons();
      geminiAudioPlayer.onloadedmetadata = () => {
        if (geminiAudioPlayer.duration && !isNaN(geminiAudioPlayer.duration)) {
          const page = PAGES[currentPageIndex];
          if (page?.sentences) scheduleSentenceHighlights(page.sentences, geminiAudioPlayer.duration, Math.max(0, currentSentenceIndex), startOffsetSec, mySession);
        }
      };
      geminiAudioPlayer.onended = () => { if (mySession === readSessionId) onEndedCallback(); };
      geminiAudioPlayer.onerror = () => { if (mySession === readSessionId) startWebSpeechFallback(Math.max(0, currentSentenceIndex), mySession); };
      geminiAudioPlayer.src = blobUrl;
      if (startOffsetSec > 0) geminiAudioPlayer.currentTime = startOffsetSec;
      geminiAudioPlayer.play().catch(() => { if (mySession === readSessionId) startWebSpeechFallback(Math.max(0, currentSentenceIndex), mySession); });
    }

    async function startReadingPage(startIdx = 0, autoContinuePages = true, existingSession = null) {
      const mySession = existingSession !== null ? existingSession : ++readSessionId;
      clearTimers();
      stopActiveWebAudioSource();
      try { geminiAudioPlayer.pause(); } catch (e) {}
      if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }

      isReading = true;
      isAutoBedtime = autoContinuePages;
      syncControlButtons();

      if (parentAudioCache[currentPageIndex]) {
        highlightSentence(-2);
        playAudioElementUrl(parentAudioCache[currentPageIndex], 0, mySession, () => handlePageFinished(mySession));
        return;
      }

      const currentPageObj = PAGES[currentPageIndex];
      if (selectedEngine !== "web-speech" && currentPageObj?.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) {
        isGeneratingAudio = false;
        syncControlButtons();
        const fractions = getSentenceFractions(currentPageObj.sentences);
        const estDuration = currentPageObj.durationSec || 10.5;
        const startOffsetSec = estDuration * (fractions[startIdx] || 0);
        scheduleSentenceHighlights(currentPageObj.sentences, estDuration, startIdx, startOffsetSec, mySession);
        playAudioElementUrl(currentPageObj.audio, startOffsetSec, mySession, () => handlePageFinished(mySession));
        return;
      }

      if (selectedEngine === "gemini-tts") {
        try {
          const page = PAGES[currentPageIndex];
          const cacheKey = `page_${currentPageIndex}`;
          if (!geminiPcmCache[cacheKey]) {
            isGeneratingAudio = true;
            syncControlButtons();
          }

          const ttsData = await fetchGeminiTtsPage(currentPageIndex);
          if (!isReading || mySession !== readSessionId) return;

          if (currentPageIndex + 1 < PAGES.length) {
            const nextIdx = currentPageIndex + 1;
            const nextKey = `page_${nextIdx}`;
            if (!geminiPcmCache[nextKey] && !inflightRequests[nextKey]) {
              fetchGeminiTtsPage(nextIdx).catch(() => {});
            }
          }

          isGeneratingAudio = false;
          syncControlButtons();
          const fractions = getSentenceFractions(page.sentences);
          const startOffsetSec = (ttsData.durationSec || 0) * (fractions[startIdx] || 0);
          scheduleSentenceHighlights(page.sentences, ttsData.durationSec || 0, startIdx, startOffsetSec, mySession);

          if (!playPcmViaWebAudio(ttsData, startOffsetSec, mySession, () => handlePageFinished(mySession))) {
            playAudioElementUrl(ttsData.wavBlobUrl, startOffsetSec, mySession, () => handlePageFinished(mySession));
          }
          return;
        } catch (err) {
          if (!isReading || mySession !== readSessionId) return;
          isGeneratingAudio = false;
          syncControlButtons();
          if (statusHint) statusHint.textContent = "⚡ 已自動切換內建台灣語音秒播（背景持續快取 Leda 語音）";
          startWebSpeechFallback(startIdx, mySession);
          return;
        }
      }

      startWebSpeechFallback(startIdx, mySession);
    }

    function startWebSpeechFallback(startIdx, mySession) {
      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        stopReading();
        return;
      }
      keepAliveInterval = setInterval(() => {
        if (!isReading || mySession !== readSessionId) { clearInterval(keepAliveInterval); return; }
        if (window.speechSynthesis.speaking && window.speechSynthesis.paused) {
          try { window.speechSynthesis.resume(); } catch (e) {}
        }
      }, 4000);
      speakSentenceStep(startIdx, mySession);
    }

    function speakSentenceStep(sIdx, mySession) {
      if (!isReading || mySession !== readSessionId) return;
      const page = PAGES[currentPageIndex];
      if (!page || sIdx >= page.sentences.length) {
        handlePageFinished(mySession);
        return;
      }
      highlightSentence(sIdx);
      const utter = new SpeechSynthesisUtterance(cleanTextForTTS(page.sentences[sIdx]));
      window._activeBedtimeUtterance = utter;
      if (!bestTaiwanVoice && "speechSynthesis" in window) refreshVoices();
      if (bestTaiwanVoice) { utter.voice = bestTaiwanVoice; utter.lang = bestTaiwanVoice.lang || "zh-TW"; }
      else { utter.lang = "zh-TW"; }
      utter.rate = 0.96;

      let startedSpeaking = false;
      const watchdog = setTimeout(() => {
        if (!startedSpeaking && mySession === readSessionId && isReading) stopReading();
      }, 2500);

      utter.onstart = () => {
        startedSpeaking = true;
        clearTimeout(watchdog);
        if (mySession !== readSessionId) return;
        isGeneratingAudio = false;
        syncControlButtons();
      };
      utter.onend = () => {
        clearTimeout(watchdog);
        if (!isReading || mySession !== readSessionId) return;
        nextSentenceTimeout = setTimeout(() => speakSentenceStep(sIdx + 1, mySession), 240);
      };
      utter.onerror = (ev) => {
        clearTimeout(watchdog);
        if (!isReading || mySession !== readSessionId) return;
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        if (!startedSpeaking) { stopReading(); return; }
        nextSentenceTimeout = setTimeout(() => speakSentenceStep(sIdx + 1, mySession), 240);
      };
      try { window.speechSynthesis.speak(utter); } catch (e) { clearTimeout(watchdog); stopReading(); }
    }

    function goToPage(newIndex) {
      if (newIndex < 0 || newIndex >= PAGES.length || newIndex === currentPageIndex) return;
      const wasReading = isReading;
      stopReading();
      currentPageIndex = newIndex;
      renderPage();
      if (wasReading) {
        startReadingPage(0, true);
      } else {
        scheduleBackgroundPreload(currentPageIndex);
      }
    }

    playToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      if (isReading) stopReading(); else startReadingPage(0, true);
    });

    quickModeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      selectedEngine = selectedEngine === "gemini-tts" ? "web-speech" : "gemini-tts";
      updateCacheHint();
      if (statusHint) {
        statusHint.textContent = selectedEngine === "web-speech"
          ? "⚡ 已切換為「內建台灣語音」：0 秒等待、即點即念"
          : "✨ 已切換為「Leda AI 台灣語音」";
      }
      if (isReading) startReadingPage(Math.max(0, currentSentenceIndex), true);
    });

    voiceInfoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      refreshVoices();
      voiceModal.classList.remove("hidden");
    });

    prevPageBtn.addEventListener("click", (e) => { e.stopPropagation(); unlockAudioOnUserGesture(); goToPage(currentPageIndex - 1); });
    nextPageBtn.addEventListener("click", (e) => { e.stopPropagation(); unlockAudioOnUserGesture(); goToPage(currentPageIndex + 1); });

    let touchStartX = 0, touchStartY = 0;
    storybookMain.addEventListener("touchstart", (e) => {
      if (e.touches?.length === 1) { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }
    }, { passive: true });
    storybookMain.addEventListener("touchend", (e) => {
      if (e.changedTouches?.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX, dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
          unlockAudioOnUserGesture();
          if (dx < 0 && currentPageIndex < PAGES.length - 1) goToPage(currentPageIndex + 1);
          else if (dx > 0 && currentPageIndex > 0) goToPage(currentPageIndex - 1);
        }
      }
    }, { passive: true });

    closeVoiceModalBtn.addEventListener("click", () => voiceModal.classList.add("hidden"));
    confirmVoiceModalBtn.addEventListener("click", () => voiceModal.classList.add("hidden"));
    engineSelect.addEventListener("change", (e) => { selectedEngine = e.target.value; updateCacheHint(); });

    downloadWavBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      const orig = downloadWavBtn.textContent;
      try {
        downloadWavBtn.textContent = "⏳ 合成中...";
        downloadWavBtn.disabled = true;
        const ttsData = await fetchGeminiTtsPage(currentPageIndex, null, 35000);
        const a = document.createElement("a");
        a.href = ttsData.wavBlobUrl;
        a.download = `有聲繪本_第${currentPageIndex + 1}頁_台灣語音.wav`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        downloadWavBtn.textContent = "✅ 已下載";
      } catch (err) {
        downloadWavBtn.textContent = "⚠️ 需填入 Key";
      } finally {
        downloadWavBtn.disabled = false;
        setTimeout(() => { downloadWavBtn.textContent = orig; }, 2500);
      }
    });

    recordBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      if (isRecordingNow && mediaRecorder) {
        mediaRecorder.stop();
        isRecordingNow = false;
        recordBtn.textContent = "⏺️ 開始錄音";
        recordBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition";
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        recordStatusText.textContent = "⚠️ 瀏覽器未開啟麥克風權限，請使用右側「匯入音檔」。";
        return;
      }
      try {
        stopReading();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (ev) => { if (ev.data?.size > 0) recordedChunks.push(ev.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          parentAudioCache[currentPageIndex] = URL.createObjectURL(new Blob(recordedChunks, { type: "audio/webm" }));
          selectedEngine = "parent-record";
          recordStatusText.textContent = `✅ 第 ${currentPageIndex + 1} 頁錄音完成！`;
          updateCacheHint();
        };
        mediaRecorder.start();
        isRecordingNow = true;
        recordBtn.textContent = "⏹️ 停止並儲存";
        recordBtn.className = "flex-1 bg-amber-400 text-[#1C1714] text-xs font-bold py-2 px-3 rounded-xl animate-pulse";
        recordStatusText.textContent = "🎙️ 正在錄音中... 請自然念出本頁故事。";
      } catch (err) {
        recordStatusText.textContent = "⚠️ 無法啟動麥克風，請確認權限或使用「匯入音檔」。";
      }
    });

    uploadAudioInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      parentAudioCache[currentPageIndex] = URL.createObjectURL(file);
      selectedEngine = "parent-record";
      recordStatusText.textContent = `✅ 已匯入「${file.name}」作為第 ${currentPageIndex + 1} 頁語音！`;
      updateCacheHint();
    });

    testVoiceBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      stopReading();
      const sampleLine = "咚咚咚！猜猜看，今天是誰要一起聽故事呀？";
      if (selectedEngine === "gemini-tts") {
        try {
          const ttsData = await fetchGeminiTtsPage(0, sampleLine, 12000);
          isReading = true;
          const mySession = ++readSessionId;
          const onEnd = () => { isReading = false; syncControlButtons(); };
          if (!playPcmViaWebAudio(ttsData, 0, mySession, onEnd)) playAudioElementUrl(ttsData.wavBlobUrl, 0, mySession, onEnd);
          return;
        } catch (e) {}
      }
      if (!("speechSynthesis" in window)) return;
      const utter = new SpeechSynthesisUtterance(sampleLine);
      window._activeBedtimeUtterance = utter;
      if (!bestTaiwanVoice) refreshVoices();
      if (bestTaiwanVoice) { utter.voice = bestTaiwanVoice; utter.lang = bestTaiwanVoice.lang || "zh-TW"; } else { utter.lang = "zh-TW"; }
      utter.rate = 0.96;
      window.speechSynthesis.speak(utter);
    });

    renderPage();
    if (!PAGES[0]?.audio) {
      fetchGeminiTtsPage(0).then(() => {
        if (PAGES.length > 1 && !PAGES[1]?.audio) {
          setTimeout(() => fetchGeminiTtsPage(1).catch(() => {}), 1200);
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
