<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{STORY_TITLE}}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #14110F;
      color: #EDE4D7;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-x: none;
    }
    .sentence-item {
      transition: background-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
      border-radius: 0.75rem;
      padding: 0.35rem 0.6rem;
      margin: 0 -0.4rem;
      cursor: pointer;
    }
    .sentence-active {
      background: rgba(245, 158, 11, 0.18);
      color: #FDE68A;
    }
    .edge-nav-btn {
      opacity: 0.55;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    .edge-nav-btn:active {
      opacity: 0.95;
      transform: scale(0.92);
    }
    .edge-nav-btn:disabled {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#14110F] text-[#EDE4D7] flex flex-col items-center justify-start px-2.5 pt-2 pb-16 sm:px-4 sm:py-4 select-none">

  <!-- Portrait Storybook Container: Large Vertical Illustration + Direct Story Text -->
  <main id="storybookMain" class="w-full max-w-md flex flex-col gap-2.5">

    <!-- Large Vertical 3:4 Illustration Card (Occupies ~55-60% of phone screen) -->
    <div id="illustrationBox" class="relative w-full aspect-[3/4] max-h-[58vh] sm:max-h-[62vh] rounded-3xl overflow-hidden shadow-2xl border border-[#2E2621] bg-[#1C1714]">
      <img id="pageImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="繪本插圖" class="w-full h-full object-cover block select-none pointer-events-none">

      <!-- Subtle bottom gradient for corner button legibility -->
      <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/55 via-black/15 to-transparent pointer-events-none"></div>

      <!-- Top-Left: Minimal Page Badge & Reading Indicator -->
      <div class="absolute top-3 left-3 z-10 flex items-center gap-2 pointer-events-none">
        <span id="pageBadge" class="bg-black/45 backdrop-blur-md text-[#EDE4D7]/90 text-xs font-medium px-2.5 py-1 rounded-full border border-white/10 tabular-nums">
          1 / 10
        </span>
        <div id="readingIndicator" class="hidden bg-black/60 backdrop-blur-md text-amber-300 text-xs font-medium px-2.5 py-1 rounded-full border border-amber-400/30 flex items-center gap-1.5">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
          <span id="readingIndicatorText">朗讀中</span>
        </div>
      </div>

      <!-- Left & Right Edge Tap Zones for One-Handed Page Turning -->
      <button id="prevPageBtn" type="button" aria-label="上一頁" class="edge-nav-btn absolute inset-y-12 left-0 w-14 z-10 flex items-center justify-start pl-2 focus:outline-none">
        <span class="w-7 h-7 rounded-full bg-black/35 backdrop-blur-sm border border-white/15 text-white/85 flex items-center justify-center text-sm">‹</span>
      </button>
      <button id="nextPageBtn" type="button" aria-label="下一頁" class="edge-nav-btn absolute inset-y-12 right-0 w-14 z-10 flex items-center justify-end pr-2 focus:outline-none">
        <span class="w-7 h-7 rounded-full bg-black/35 backdrop-blur-sm border border-white/15 text-white/85 flex items-center justify-center text-sm">›</span>
      </button>

      <!-- Bottom-Right Floating Audio Controls (Unobtrusive & away from bottom-center system bar) -->
      <div class="absolute bottom-3 right-3 z-20 flex items-center gap-2">
        <button id="voiceInfoBtn" type="button" class="w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 active:scale-95 backdrop-blur-md text-[#EDE4D7] border border-white/15 flex items-center justify-center text-sm shadow-lg transition" title="語音與錄音設定">
          🎙️
        </button>
        <button id="playToggleBtn" type="button" class="bg-amber-400/95 hover:bg-amber-300 active:scale-95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md">
          <span id="playToggleIcon">🔊</span>
          <span id="playToggleLabel">念故事</span>
        </button>
      </div>
    </div>

    <!-- Clean Story Text Card (Directly below image, comfortable reading size) -->
    <section id="storyTextCard" class="bg-[#1F1A16] rounded-3xl px-5 py-4 border border-[#2E2621] shadow-inner">
      <h2 id="pageTitle" class="sr-only"></h2>
      <div id="storySentences" class="text-[18px] sm:text-[20px] leading-[1.75] text-[#EDE4D7] space-y-2.5 font-normal"></div>
      <div class="mt-2.5 pt-2 border-t border-[#2E2621]/60 flex items-center justify-between text-[11px] text-[#9E9183]">
        <span id="statusHint">左右滑動翻頁・點文字可從該段朗讀</span>
        <span id="cacheDot" class="text-[#9E9183]"></span>
      </div>
    </section>

    <!-- Hidden native HTML5 Audio element -->
    <audio id="geminiAudioPlayer" preload="auto" playsinline class="hidden"></audio>
  </main>

  <!-- Streamlined Taiwan Voice & Parent Recording Modal -->
  <div id="voiceModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-[#1F1A16] border border-[#382E28] rounded-3xl max-w-sm w-full p-5 shadow-2xl space-y-4 my-4 text-[#EDE4D7]">
      <div class="flex items-center justify-between">

        <button id="closeVoiceModalBtn" type="button" class="text-[#9E9183] hover:text-white text-lg font-bold px-2">✕</button>
      </div>

      <div class="space-y-3.5 text-sm leading-relaxed">
        <!-- AI Voice Selection -->
        <div class="bg-[#29221D] rounded-2xl p-3.5 border border-[#382E28] space-y-2.5">

            <label for="geminiVoiceSelect" class="font-semibold text-amber-200 text-xs sm:text-sm">✨ AI 說故事聲線：</label>
            <select id="geminiVoiceSelect" class="bg-[#181411] text-amber-200 text-xs sm:text-sm rounded-xl px-2.5 py-1.5 border border-[#473B33] focus:outline-none">
              <option value="Kore">Kore（溫暖故事媽媽・預設）</option>
              <option value="Aoede">Aoede（親切自然女聲）</option>
              <option value="Leda">Leda（柔和甜美姊姊）</option>

            <label for="engineSelect" class="text-xs text-[#B5A899]">朗讀模式：</label>
            <select id="engineSelect" class="bg-[#181411] text-[#EDE4D7] text-xs rounded-xl px-2.5 py-1.5 border border-[#473B33] focus:outline-none">
              <option value="gemini-tts">✨ Gemini AI 自然台灣語音</option>

        <!-- Parent Recording Section -->

          <div class="flex gap-2">

        </div>

        <!-- Collapsible Advanced Settings (API Key, WAV Download, Fallback Voice) -->
        <details class="bg-[#241E1A] rounded-2xl px-3.5 py-2.5 border border-[#332A24] text-xs text-[#B5A899]">
          <summary class="cursor-pointer font-medium text-[#D1C5B7] select-none">進階選項（下載音檔 / 備援設定）</summary>
          <div class="mt-3 space-y-3 pt-2 border-t border-[#332A24]">
            <div class="flex items-center justify-between">
              <span>下載本頁 AI 語音檔：</span>
              <button id="downloadWavBtn" type="button" class="bg-[#382E28] hover:bg-[#473B33] text-amber-200 font-semibold px-2.5 py-1 rounded-lg border border-[#4D3F37]">
                ⬇️ 下載 .wav
              </button>
            </div>
            <div>
              <label for="customApiKeyInput" class="block mb-1">選填 Gemini API Key（Canvas 內免填）：</label>
              <input id="customApiKeyInput" type="password" placeholder="預設自動帶入憑證" class="w-full bg-[#181411] text-[#EDE4D7] text-xs rounded-lg px-2.5 py-1.5 border border-[#382E28] focus:outline-none">
            </div>
            <div>
              <label for="voiceSelect" class="block mb-1">離線備援系統聲線（zh-TW）：</label>
              <select id="voiceSelect" class="w-full bg-[#181411] text-[#EDE4D7] text-xs rounded-lg px-2.5 py-1.5 border border-[#382E28] focus:outline-none">
                <option value="auto-tw">自動鎖定台灣國語 (zh-TW)</option>
              </select>
              <p id="detectedVoiceNote" class="text-[11px] text-emerald-300/80 mt-1"></p>
            </div>
          </div>
        </details>
      </div>

      <div class="flex gap-2 pt-1">
        <button id="testVoiceBtn" type="button" class="flex-1 bg-amber-400 hover:bg-amber-300 text-[#1C1714] font-bold py-2.5 px-4 rounded-xl text-sm transition">
          🔊 試聽聲音
        </button>
        <button id="confirmVoiceModalBtn" type="button" class="bg-[#2E2621] hover:bg-[#382E28] text-[#EDE4D7] font-semibold py-2.5 px-5 rounded-xl border border-[#473B33] text-sm transition">
          完成
        </button>
      </div>
    </div>
  </div>

  <script>
    // In Gemini Canvas runtime, keeping apiKey = "" allows Canvas to inject credentials automatically
    const apiKey = "";

    // Generated array of 9-13 page objects:
    // [{ pageNum: 1, badge: "1 / 10", title: "...", img: "data:image/jpeg;base64,...", audio: "data:audio/mp3;base64,...", sentences: ["...", "..."] }, ...]
    const PAGES = __PAGES_JSON_PLACEHOLDER__;

    // State
    let currentPageIndex = 0;
    let currentSentenceIndex = -1;
    let isReading = false;
    let isGeneratingAudio = false;
    let isAutoBedtime = true;
    let selectedEngine = "gemini-tts"; // 'gemini-tts' | 'parent-record' | 'web-speech'
    let selectedGeminiVoice = "Kore";
    let selectedVoiceURI = "auto-tw";
    let availableVoices = [];
    let bestTaiwanVoice = null;
    let keepAliveInterval = null;
    let nextSentenceTimeout = null;
    let sentenceHighlightTimers = [];
    let readSessionId = 0;
    let preloadQueueToken = 0;

    // Unified Page-Level Audio Cache & In-flight deduplication
    // Synthesizing both short paragraphs of a page together guarantees 100% consistent voice timbre & pitch
    const geminiPcmCache = {};   // key: `page_${pageIdx}_${voiceName}` -> { base64Data, sampleRate, durationSec, wavBlobUrl }
    const inflightRequests = {}; // key -> Promise
    const parentAudioCache = {}; // pageIndex -> blobURL
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecordingNow = false;

    window._activeBedtimeUtterance = null;
    window._bedtimeAudioCtx = null;
    window._activeAudioSource = null;
    window._htmlAudioUnlocked = false;

    // DOM Elements
    const storybookMain = document.getElementById("storybookMain");
    const pageBadge = document.getElementById("pageBadge");
    const pageImage = document.getElementById("pageImage");
    const pageTitle = document.getElementById("pageTitle");
    const storySentences = document.getElementById("storySentences");
    const statusHint = document.getElementById("statusHint");
    const cacheDot = document.getElementById("cacheDot");
    const readingIndicator = document.getElementById("readingIndicator");
    const readingIndicatorText = document.getElementById("readingIndicatorText");
    const playToggleBtn = document.getElementById("playToggleBtn");
    const playToggleIcon = document.getElementById("playToggleIcon");
    const playToggleLabel = document.getElementById("playToggleLabel");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const voiceInfoBtn = document.getElementById("voiceInfoBtn");
    const voiceModal = document.getElementById("voiceModal");
    const closeVoiceModalBtn = document.getElementById("closeVoiceModalBtn");
    const confirmVoiceModalBtn = document.getElementById("confirmVoiceModalBtn");
    const engineSelect = document.getElementById("engineSelect");
    const geminiVoiceSelect = document.getElementById("geminiVoiceSelect");
    const customApiKeyInput = document.getElementById("customApiKeyInput");
    const downloadWavBtn = document.getElementById("downloadWavBtn");
    const recordPageNumLabel = document.getElementById("recordPageNumLabel");
    const recordBtn = document.getElementById("recordBtn");
    const uploadAudioInput = document.getElementById("uploadAudioInput");
    const recordStatusText = document.getElementById("recordStatusText");
    const voiceSelect = document.getElementById("voiceSelect");
    const detectedVoiceNote = document.getElementById("detectedVoiceNote");
    const testVoiceBtn = document.getElementById("testVoiceBtn");
    const geminiAudioPlayer = document.getElementById("geminiAudioPlayer");

    // Unlock Web Audio API & HTML5 Audio synchronously inside the user's tap gesture
    function unlockAudioOnUserGesture() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          if (!window._bedtimeAudioCtx) {
            window._bedtimeAudioCtx = new AC();
          }
          if (window._bedtimeAudioCtx.state === "suspended") {
            window._bedtimeAudioCtx.resume().catch(() => {});
          }
          const silentBuf = window._bedtimeAudioCtx.createBuffer(1, 1, 22050);
          const silentSrc = window._bedtimeAudioCtx.createBufferSource();
          silentSrc.buffer = silentBuf;
          silentSrc.connect(window._bedtimeAudioCtx.destination);
          silentSrc.start(0);
        }
      } catch (e) {}

      if (!window._htmlAudioUnlocked && geminiAudioPlayer) {
        try {
          geminiAudioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
          const p = geminiAudioPlayer.play();
          if (p && typeof p.then === "function") {
            p.then(() => {
              geminiAudioPlayer.pause();
              geminiAudioPlayer.currentTime = 0;
              window._htmlAudioUnlocked = true;
            }).catch(() => {});
          }
        } catch (e) {}
      }
    }

    // Convert raw PCM16 binary string to WAV Blob URL
    function pcm16BinaryToWavBlobUrl(binaryString, sampleRate = 24000, numChannels = 1) {
      const dataSize = binaryString.length;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      };

      const bitsPerSample = 16;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const byteRate = sampleRate * blockAlign;

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);

      const bytes = new Uint8Array(buffer, 44);
      for (let i = 0; i < dataSize; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const wavBlob = new Blob([buffer], { type: "audio/wav" });
      return URL.createObjectURL(wavBlob);
    }

    // Fetch a full page (2 short paragraphs combined) in ONE single TTS request so the narrator's
    // voice timbre, pitch, and acoustic room stay 100% consistent across the page.
    let ttsCooldownUntil = 0;
    async function fetchGeminiTtsPage(pageIdx, customText = null, isBackgroundPreload = false) {
      const voiceName = selectedGeminiVoice || "Kore";
      const cacheKey = customText
        ? `custom_${voiceName}_${customText}`
        : `page_${pageIdx}_${voiceName}`;

      if (geminiPcmCache[cacheKey]) {
        return geminiPcmCache[cacheKey];
      }
      if (Date.now() < ttsCooldownUntil) {
        throw new Error("TTS cooldown active");
      }
      if (inflightRequests[cacheKey]) {
        return inflightRequests[cacheKey];
      }

      const requestPromise = (async () => {
        const activeKey = (customApiKeyInput && customApiKeyInput.value.trim())
          ? customApiKeyInput.value.trim()
          : apiKey;
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${activeKey}`;
        const rawText = customText || (PAGES[pageIdx]?.sentences || []).join(" ");
        const ttsPrompt = `請用溫柔自然的台灣故事媽媽語氣朗讀：${rawText}`;

        const payload = {
          contents: [{ parts: [{ text: ttsPrompt }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: voiceName }
              }
            }
          }
        };

        // Single attempt with hard Promise.race timeout (7.5s) so Canvas postMessage bridge queues never hang for minutes
        const controller = new AbortController();
        let timeoutId = null;
        const timeoutPromise = new Promise((_, reject) => {
          timeoutId = setTimeout(() => {
            controller.abort();
            reject(new Error("TTS request timed out"));
          }, 7500);
        });

        try {
          const resp = await Promise.race([
            fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: controller.signal
            }),
            timeoutPromise
          ]);
          clearTimeout(timeoutId);

          if (!resp.ok) {
            if (resp.status === 429 || resp.status === 503) {
              ttsCooldownUntil = Date.now() + 25000;
            }
            throw new Error(`HTTP ${resp.status}`);
          }

          const data = await resp.json();
          const parts = data?.candidates?.[0]?.content?.parts || [];
          const audioPart = parts.find(p => p.inlineData && p.inlineData.data);
          if (!audioPart || !audioPart.inlineData.data || audioPart.inlineData.data.length < 150) {
            throw new Error("Empty audio payload");
          }

          let sampleRate = 24000;
          const mime = audioPart.inlineData.mimeType || "";
          if (mime.includes("rate=")) {
            const m = mime.match(/rate=(\d+)/);
            if (m) sampleRate = parseInt(m[1], 10);
          }

          const binaryString = window.atob(audioPart.inlineData.data);
          const numSamples = Math.floor(binaryString.length / 2);
          const durationSec = numSamples / sampleRate;
          const wavBlobUrl = pcm16BinaryToWavBlobUrl(binaryString, sampleRate, 1);

          const resultObj = {
            base64Data: audioPart.inlineData.data,
            sampleRate: sampleRate,
            durationSec: durationSec,
            wavBlobUrl: wavBlobUrl
          };
          geminiPcmCache[cacheKey] = resultObj;
          updateCacheHint();
          return resultObj;
        } catch (err) {
          clearTimeout(timeoutId);
          if (err && String(err.message).includes("timed out")) {
            ttsCooldownUntil = Date.now() + 15000;
          }
          throw err || new Error("TTS failed");
        }
      })();

      inflightRequests[cacheKey] = requestPromise;
      try {
        return await requestPromise;
      } finally {
        delete inflightRequests[cacheKey];
      }
    }

    // Calculate proportional start times (0.0 to 1.0) for each paragraph on a page based on character count
    function getSentenceFractions(sentences) {
      if (!sentences || !sentences.length) return [0];
      const lengths = sentences.map(s => Math.max(1, s.replace(/\s+/g, "").length));
      const total = lengths.reduce((acc, n) => acc + n, 0);
      const fractions = [0];
      let accum = 0;
      for (let i = 0; i < lengths.length; i++) {
        accum += lengths[i];
        fractions.push(accum / total);
      }
      return fractions;
    }

    function clearHighlightTimers() {
      if (sentenceHighlightTimers.length) {
        sentenceHighlightTimers.forEach(id => clearTimeout(id));
        sentenceHighlightTimers = [];
      }
    }

    // Schedule automatic paragraph highlighting synchronized with the unified page audio
    function scheduleSentenceHighlights(sentences, totalDurationSec, startIdx, startOffsetSec, mySession) {
      clearHighlightTimers();
      highlightSentence(startIdx);
      if (!sentences || sentences.length <= 1 || totalDurationSec <= 0) return;

      const fractions = getSentenceFractions(sentences);
      for (let j = startIdx + 1; j < sentences.length; j++) {
        const targetSec = totalDurationSec * fractions[j];
        const delayMs = Math.max(0, (targetSec - startOffsetSec) * 1000);
        const timerId = setTimeout(() => {
          if (isReading && mySession === readSessionId) {
            highlightSentence(j);
          }
        }, delayMs);
        sentenceHighlightTimers.push(timerId);
      }
    }

    // Play unified PCM16 buffer via Web Audio API, optionally starting from startOffsetSec
    function playPcmViaWebAudio(ttsData, startOffsetSec, mySession, onFinishedCallback) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!window._bedtimeAudioCtx && AC) {
          window._bedtimeAudioCtx = new AC();
        }
        const ctx = window._bedtimeAudioCtx;
        if (!ctx) return false;
        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }

        const binaryString = window.atob(ttsData.base64Data);
        const numSamples = Math.floor(binaryString.length / 2);
        if (numSamples < 80) return false;

        const audioBuffer = ctx.createBuffer(1, numSamples, ttsData.sampleRate || 24000);
        const channelData = audioBuffer.getChannelData(0);
        for (let i = 0; i < numSamples; i++) {
          const lo = binaryString.charCodeAt(i * 2);
          const hi = binaryString.charCodeAt(i * 2 + 1);
          let sample = (hi << 8) | lo;
          if (sample >= 0x8000) sample -= 0x10000;
          let normalized = (sample / 32768.0) * 1.15;
          if (normalized > 1.0) normalized = 1.0;
          if (normalized < -1.0) normalized = -1.0;
          channelData[i] = normalized;
        }

        stopActiveWebAudioSource();
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(ctx.destination);
        window._activeAudioSource = source;

        source.onended = () => {
          if (window._activeAudioSource === source) {
            window._activeAudioSource = null;
          }
          if (mySession === readSessionId && isReading && typeof onFinishedCallback === "function") {
            onFinishedCallback();
          }
        };

        const safeOffset = Math.min(Math.max(0, startOffsetSec || 0), Math.max(0, audioBuffer.duration - 0.05));
        source.start(0, safeOffset);
        return true;
      } catch (e) {
        return false;
      }
    }

    function stopActiveWebAudioSource() {
      if (window._activeAudioSource) {
        try {
          window._activeAudioSource.onended = null;
          window._activeAudioSource.stop();
          window._activeAudioSource.disconnect();
        } catch (e) {}
        window._activeAudioSource = null;
      }
    }

    // Lightweight on-demand preload: do not spam Gemini Preview TTS on rapid page swipes
    let preloadDebounceTimer = null;
    function preloadUpcomingPages(startPageIdx) {
      if (selectedEngine !== "gemini-tts") return;
      if (Date.now() < ttsCooldownUntil) return;
      if (preloadDebounceTimer) clearTimeout(preloadDebounceTimer);
      const myToken = ++preloadQueueToken;
      preloadDebounceTimer = setTimeout(async () => {
        if (myToken !== preloadQueueToken) return;
        if (PAGES[startPageIdx]?.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) return;
        try {
          await fetchGeminiTtsPage(startPageIdx, null, true);
        } catch (e) {}
      }, 1000);
    }

    function updateCacheHint() {
      const pageKey = `page_${currentPageIndex}_${selectedGeminiVoice || "Kore"}`;
      if (cacheDot) {
        if (parentAudioCache[currentPageIndex]) {
          cacheDot.textContent = "❤️ 爸媽錄音已就緒";
        } else if (PAGES[currentPageIndex]?.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) {
          cacheDot.textContent = "✨ 台灣真人母語聲已內嵌";
        } else if (geminiPcmCache[pageKey]) {
          cacheDot.textContent = "✨ 本頁語音已預載";
        } else {
          cacheDot.textContent = "";
        }
      }
    }

    function scoreTaiwanVoice(v) {
      const lang = (v.lang || "").toLowerCase().replace("_", "-");
      const name = (v.name || "").toLowerCase();
      const combined = lang + " " + name;

      if (!/zh|cmn|chinese|taiwan|國語|臺灣|台灣|美佳|mei-jia|hsiao|yunjhe/i.test(combined)) {
        return -100;
      }

      let score = 0;
      if (lang === "zh-tw" || lang.includes("zh-tw") || lang.includes("hant-tw") || /taiwan|臺灣|台灣|美佳|mei-jia|hsiaochen|hsiaoyu|yunjhe|曉臻|曉雨|允哲/i.test(combined)) {
        score += 100;
      } else if (lang.includes("hant") || lang.includes("hk")) {
        score += 10;
      } else if (lang.includes("cn") || lang.includes("hans") || /mainland|普通话|中国/i.test(combined)) {
        score -= 50;
      }

      if (/natural|neural|online|premium|enhanced|siri|優化|高音質|增強/i.test(combined)) {
        score += 45;
      }
      if (/hsiaochen|hsiaoyu|mei-jia|美佳|曉臻|曉雨|google 國語（臺灣）|google 國語/i.test(combined)) {
        score += 25;
      }
      if (!v.localService) {
        score += 10;
      }
      return score;
    }

    function refreshVoices() {
      if (!("speechSynthesis" in window)) return;
      const rawVoices = window.speechSynthesis.getVoices() || [];
      if (!rawVoices.length) return;
      availableVoices = rawVoices;

      const scored = rawVoices
        .map(v => ({ voice: v, score: scoreTaiwanVoice(v) }))
        .filter(item => item.score > -50)
        .sort((a, b) => b.score - a.score);

      bestTaiwanVoice = scored.length > 0 ? scored[0].voice : null;

      const prevSelection = selectedVoiceURI;
      voiceSelect.innerHTML = '<option value="auto-tw">自動最佳台灣語音 (推薦)</option>';
      scored.forEach(({ voice, score }) => {
        const opt = document.createElement("option");
        opt.value = voice.voiceURI;
        const isTW = score >= 100 ? "🇹🇼 " : "";
        opt.textContent = `${isTW}${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(opt);
      });

      if (prevSelection && Array.from(voiceSelect.options).some(o => o.value === prevSelection)) {
        voiceSelect.value = prevSelection;
      } else {
        selectedVoiceURI = "auto-tw";
        voiceSelect.value = "auto-tw";
      }

      if (bestTaiwanVoice) {
        detectedVoiceNote.textContent = `已鎖定：${bestTaiwanVoice.name} (${bestTaiwanVoice.lang})`;
      } else {
        detectedVoiceNote.textContent = "將以 zh-TW 台灣國語朗讀。";
      }
    }

    if ("speechSynthesis" in window) {
      refreshVoices();
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }

    function getActiveVoice() {
      if (!availableVoices.length && "speechSynthesis" in window) {
        refreshVoices();
      }
      if (selectedVoiceURI !== "auto-tw") {
        const chosen = availableVoices.find(v => v.voiceURI === selectedVoiceURI);
        if (chosen) return chosen;
      }
      return bestTaiwanVoice;
    }

    function cleanTextForTTS(text) {
      return text
        .replace(/——+/g, "，")
        .replace(/……+/g, "，")
        .replace(/[「」『』【】]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderPage() {
      const p = PAGES[currentPageIndex];
      pageBadge.textContent = p.badge || `${currentPageIndex + 1} / ${PAGES.length}`;
      pageImage.src = p.img;
      pageImage.alt = p.title || `第 ${currentPageIndex + 1} 頁插圖`;
      pageTitle.textContent = p.title || "";
      if (recordPageNumLabel) recordPageNumLabel.textContent = String(p.pageNum || (currentPageIndex + 1));

      storySentences.innerHTML = "";
      p.sentences.forEach((sentence, idx) => {
        const pEl = document.createElement("p");
        pEl.className = "sentence-item" + (idx === currentSentenceIndex ? " sentence-active" : "");
        pEl.textContent = sentence;
        pEl.addEventListener("click", () => {
          unlockAudioOnUserGesture();
          startReadingPage(idx, true);
        });
        storySentences.appendChild(pEl);
      });

      prevPageBtn.disabled = currentPageIndex === 0;
      nextPageBtn.disabled = currentPageIndex === PAGES.length - 1;

      if (parentAudioCache[currentPageIndex]) {
        recordStatusText.textContent = `✅ 第 ${currentPageIndex + 1} 頁已儲存爸媽專屬語音！`;
      } else {
        recordStatusText.textContent = "錄音或匯入後，本頁會自動優先播放您的聲音。";
      }
      updateCacheHint();
    }

    function highlightSentence(idx) {
      currentSentenceIndex = idx;
      const items = storySentences.querySelectorAll(".sentence-item");
      items.forEach((el, i) => {
        if (idx === -2 || i === idx) {
          el.classList.add("sentence-active");
        } else {
          el.classList.remove("sentence-active");
        }
      });
    }

    function syncControlButtons() {
      if (isReading) {
        readingIndicator.classList.remove("hidden");
        if (isGeneratingAudio) {
          readingIndicatorText.textContent = "準備語音...";
          playToggleIcon.textContent = "⏳";
          playToggleLabel.textContent = "讀取中";
          playToggleBtn.className = "bg-amber-300/95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        } else {
          readingIndicatorText.textContent = "朗讀中";
          playToggleIcon.textContent = "⏹";
          playToggleLabel.textContent = "停止";
          playToggleBtn.className = "bg-rose-500/95 hover:bg-rose-400 active:scale-95 text-white font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        }
      } else {
        readingIndicator.classList.add("hidden");
        playToggleIcon.textContent = "🔊";
        playToggleLabel.textContent = "念故事";
        playToggleBtn.className = "bg-amber-400/95 hover:bg-amber-300 active:scale-95 text-[#1C1714] font-bold text-xs px-3.5 py-2 rounded-full shadow-lg flex items-center gap-1.5 transition backdrop-blur-md";
        updateCacheHint();
      }
    }

    function clearTimers() {
      if (keepAliveInterval) {
        clearInterval(keepAliveInterval);
        keepAliveInterval = null;
      }
      if (nextSentenceTimeout) {
        clearTimeout(nextSentenceTimeout);
        nextSentenceTimeout = null;
      }
      clearHighlightTimers();
    }

    function stopReading() {
      readSessionId++;
      isReading = false;
      isGeneratingAudio = false;
      clearTimers();
      window._activeBedtimeUtterance = null;
      stopActiveWebAudioSource();
      try {
        geminiAudioPlayer.pause();
        geminiAudioPlayer.currentTime = 0;
      } catch (e) {}
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      highlightSentence(-1);
      syncControlButtons();
    }

    function handlePageFinished(mySession) {
      if (!isReading || mySession !== readSessionId) return;
      clearHighlightTimers();
      if (isAutoBedtime && currentPageIndex < PAGES.length - 1) {
        nextSentenceTimeout = setTimeout(() => {
          if (!isReading || mySession !== readSessionId) return;
          currentPageIndex++;
          highlightSentence(-1);
          renderPage();
          syncControlButtons();
          startReadingPage(0, true, mySession);
        }, 650);
      } else {
        isReading = false;
        isGeneratingAudio = false;
        clearTimers();
        highlightSentence(-1);
        syncControlButtons();
        if (statusHint) {
          statusHint.textContent = currentPageIndex === PAGES.length - 1 ? "🌙 故事聽完囉，晚安！" : "左右滑動翻頁・點文字可從該段朗讀";
        }
      }
    }

    function playAudioElementUrl(blobUrl, startOffsetSec, mySession, onEndedCallback) {
      if (!isReading || mySession !== readSessionId) return;
      isGeneratingAudio = false;
      syncControlButtons();

      geminiAudioPlayer.onloadedmetadata = () => {
        if (geminiAudioPlayer.duration && !isNaN(geminiAudioPlayer.duration)) {
          const d = geminiAudioPlayer.duration;
          const page = PAGES[currentPageIndex];
          if (page && page.sentences) {
            scheduleSentenceHighlights(page.sentences, d, Math.max(0, currentSentenceIndex), startOffsetSec, mySession);
          }
        }
      };

      geminiAudioPlayer.onended = () => {
        if (mySession !== readSessionId) return;
        onEndedCallback();
      };
      geminiAudioPlayer.onerror = () => {
        if (mySession !== readSessionId) return;
        startWebSpeechFallback(Math.max(0, currentSentenceIndex), mySession);
      };
      geminiAudioPlayer.src = blobUrl;
      if (startOffsetSec > 0) {
        geminiAudioPlayer.currentTime = startOffsetSec;
      }
      geminiAudioPlayer.play().catch(() => {
        if (mySession !== readSessionId) return;
        startWebSpeechFallback(Math.max(0, currentSentenceIndex), mySession);
      });
    }

    async function startReadingPage(startIdx = 0, autoContinuePages = true, existingSession = null) {
      const mySession = existingSession !== null ? existingSession : ++readSessionId;
      clearTimers();
      stopActiveWebAudioSource();
      try {
        geminiAudioPlayer.pause();
      } catch (e) {}
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }

      isReading = true;
      isAutoBedtime = autoContinuePages;
      syncControlButtons();

      // Priority 1: Parent recorded audio for this page
      if (parentAudioCache[currentPageIndex]) {
        highlightSentence(-2);
        playAudioElementUrl(parentAudioCache[currentPageIndex], 0, mySession, () => handlePageFinished(mySession));
        return;
      }

      // Priority 1.5: Pre-synthesized Embedded Natural Taiwan Mandarin Neural Voice
      const currentPageObj = PAGES[currentPageIndex];
      if (selectedEngine !== "web-speech" && currentPageObj && currentPageObj.audio && (!customApiKeyInput || !customApiKeyInput.value.trim())) {
        isGeneratingAudio = false;
        syncControlButtons();
        const fractions = getSentenceFractions(currentPageObj.sentences);
        const estDuration = currentPageObj.durationSec || 8.0;
        const startOffsetSec = estDuration * (fractions[startIdx] || 0);
        scheduleSentenceHighlights(currentPageObj.sentences, estDuration, startIdx, startOffsetSec, mySession);
        playAudioElementUrl(currentPageObj.audio, startOffsetSec, mySession, () => handlePageFinished(mySession));
        return;
      }

      // Priority 2: Unified Page-Level Gemini TTS (consistent voice persona across paragraphs)
      if (selectedEngine === "gemini-tts") {
        try {
          const page = PAGES[currentPageIndex];
          const cacheKey = `page_${currentPageIndex}_${selectedGeminiVoice || "Kore"}`;
          if (!geminiPcmCache[cacheKey]) {
            isGeneratingAudio = true;
            syncControlButtons();
          }

          const ttsData = await fetchGeminiTtsPage(currentPageIndex);
          if (!isReading || mySession !== readSessionId) return;

          // Prefetch next page gently after 2s while current page plays to respect Preview TTS RPM limits
          if (currentPageIndex + 1 < PAGES.length) {
            const nextIdx = currentPageIndex + 1;
            setTimeout(() => {
              if (isReading && mySession === readSessionId) {
                fetchGeminiTtsPage(nextIdx, null, true).catch(() => {});
              }
            }, 2000);
          }

          isGeneratingAudio = false;
          syncControlButtons();

          const fractions = getSentenceFractions(page.sentences);
          const startOffsetSec = (ttsData.durationSec || 0) * (fractions[startIdx] || 0);
          scheduleSentenceHighlights(page.sentences, ttsData.durationSec || 0, startIdx, startOffsetSec, mySession);

          const playedWebAudio = playPcmViaWebAudio(ttsData, startOffsetSec, mySession, () => handlePageFinished(mySession));
          if (playedWebAudio) {
            return;
          }

          playAudioElementUrl(ttsData.wavBlobUrl, startOffsetSec, mySession, () => handlePageFinished(mySession));
          return;
        } catch (err) {
          if (!isReading || mySession !== readSessionId) return;
          isGeneratingAudio = false;
          syncControlButtons();
          startWebSpeechFallback(startIdx, mySession);
          return;
        }
      }

      // Priority 3: Offline Browser Web Speech API
      startWebSpeechFallback(startIdx, mySession);
    }

    function startWebSpeechFallback(startIdx, mySession) {
      if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
        stopReading();
        return;
      }

      keepAliveInterval = setInterval(() => {
        if (!isReading || mySession !== readSessionId) {
          clearInterval(keepAliveInterval);
          return;
        }
        if (window.speechSynthesis.speaking && window.speechSynthesis.paused) {
          try {
            window.speechSynthesis.resume();
          } catch (e) {}
        }
      }, 4000);

      speakSentenceStep(startIdx, mySession);
    }

    function speakSentenceStep(sIdx, mySession) {
      if (!isReading || mySession !== readSessionId) return;
      const page = PAGES[currentPageIndex];

      if (!page || sIdx >= page.sentences.length) {
        handlePageFinished(mySession);
        return;
      }

      highlightSentence(sIdx);
      const rawText = page.sentences[sIdx];
      const cleanText = cleanTextForTTS(rawText);

      const utter = new SpeechSynthesisUtterance(cleanText);
      window._activeBedtimeUtterance = utter;

      const chosenVoice = getActiveVoice();
      if (chosenVoice) {
        utter.voice = chosenVoice;
        utter.lang = chosenVoice.lang || "zh-TW";
      } else {
        utter.lang = "zh-TW";
      }

      utter.rate = 1.0;
      utter.pitch = 1.0;
      utter.volume = 1.0;

      let startedSpeaking = false;
      const watchdog = setTimeout(() => {
        if (!startedSpeaking && mySession === readSessionId && isReading) {
          stopReading();
        }
      }, 2200);

      utter.onstart = () => {
        startedSpeaking = true;
        clearTimeout(watchdog);
        if (mySession !== readSessionId) return;
        isGeneratingAudio = false;
        syncControlButtons();
      };

      utter.onend = () => {
        clearTimeout(watchdog);
        if (!isReading || mySession !== readSessionId) return;
        nextSentenceTimeout = setTimeout(() => {
          speakSentenceStep(sIdx + 1, mySession);
        }, 280);
      };

      utter.onerror = (ev) => {
        clearTimeout(watchdog);
        if (!isReading || mySession !== readSessionId) return;
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        if (!startedSpeaking) {
          stopReading();
          return;
        }
        nextSentenceTimeout = setTimeout(() => {
          speakSentenceStep(sIdx + 1, mySession);
        }, 280);
      };

      try {
        window.speechSynthesis.speak(utter);
      } catch (e) {
        clearTimeout(watchdog);
        stopReading();
      }
    }

    // Navigation helper: preserves quiet parent-reading mode unless AI narration was already active
    function goToPage(newIndex) {
      if (newIndex < 0 || newIndex >= PAGES.length || newIndex === currentPageIndex) return;
      const wasReading = isReading;
      stopReading();
      currentPageIndex = newIndex;
      renderPage();
      if (wasReading) {
        startReadingPage(0, true);
      } else {
        preloadUpcomingPages(currentPageIndex);
      }
    }

    // Event Listeners
    playToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      if (isReading) {
        stopReading();
      } else {
        startReadingPage(0, true);
      }
    });

    voiceInfoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      refreshVoices();
      voiceModal.classList.remove("hidden");
    });

    prevPageBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      goToPage(currentPageIndex - 1);
    });

    nextPageBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      unlockAudioOnUserGesture();
      goToPage(currentPageIndex + 1);
    });

    // Touch Swipe Left / Right Support for effortless one-handed page turning
    let touchStartX = 0;
    let touchStartY = 0;
    storybookMain.addEventListener("touchstart", (e) => {
      if (!e.touches || e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    storybookMain.addEventListener("touchend", (e) => {
      if (!e.changedTouches || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        unlockAudioOnUserGesture();
        if (dx < 0 && currentPageIndex < PAGES.length - 1) {
          goToPage(currentPageIndex + 1);
        } else if (dx > 0 && currentPageIndex > 0) {
          goToPage(currentPageIndex - 1);
        }
      }
    }, { passive: true });

    closeVoiceModalBtn.addEventListener("click", () => {
      voiceModal.classList.add("hidden");
    });

    confirmVoiceModalBtn.addEventListener("click", () => {
      voiceModal.classList.add("hidden");
    });

    engineSelect.addEventListener("change", (e) => {
      selectedEngine = e.target.value;
      updateCacheHint();
    });

    geminiVoiceSelect.addEventListener("change", (e) => {
      selectedGeminiVoice = e.target.value;
      preloadUpcomingPages(currentPageIndex);
    });

    voiceSelect.addEventListener("change", (e) => {
      selectedVoiceURI = e.target.value;
      const v = getActiveVoice();
      if (v) {
        detectedVoiceNote.textContent = `已選擇：${v.name} (${v.lang})`;
      }
    });

    // Download the unified WAV file for the current page
    downloadWavBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      const origText = downloadWavBtn.textContent;
      try {
        downloadWavBtn.textContent = "⏳ 合成中...";
        downloadWavBtn.disabled = true;
        const ttsData = await fetchGeminiTtsPage(currentPageIndex);
        const a = document.createElement("a");
        a.href = ttsData.wavBlobUrl;
        a.download = `有聲繪本_第${currentPageIndex + 1}頁_台灣語音.wav`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        downloadWavBtn.textContent = "✅ 已下載";
      } catch (err) {
        downloadWavBtn.textContent = "⚠️ 需填入 Key";
      } finally {
        downloadWavBtn.disabled = false;
        setTimeout(() => {
          downloadWavBtn.textContent = origText;
        }, 2500);
      }
    });

    recordBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      if (isRecordingNow && mediaRecorder) {
        mediaRecorder.stop();
        isRecordingNow = false;
        recordBtn.textContent = "⏺️ 開始錄音";
        recordBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold py-2 px-3 rounded-xl transition";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        recordStatusText.textContent = "⚠️ 瀏覽器未開啟麥克風權限，請使用右側「匯入音檔」。";
        return;
      }
      try {
        stopReading();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(recordedChunks, { type: "audio/webm" });
          parentAudioCache[currentPageIndex] = URL.createObjectURL(blob);
          selectedEngine = "parent-record";
          engineSelect.value = "parent-record";
          recordStatusText.textContent = `✅ 第 ${currentPageIndex + 1} 頁錄音完成！`;
          updateCacheHint();
        };
        mediaRecorder.start();
        isRecordingNow = true;
        recordBtn.textContent = "⏹️ 停止並儲存";
        recordBtn.className = "flex-1 bg-amber-400 text-[#1C1714] text-xs font-bold py-2 px-3 rounded-xl animate-pulse";
        recordStatusText.textContent = "🎙️ 正在錄音中... 請自然念出本頁故事。";
      } catch (err) {
        recordStatusText.textContent = "⚠️ 無法啟動麥克風，請確認權限或使用「匯入音檔」。";
      }
    });

    uploadAudioInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      parentAudioCache[currentPageIndex] = URL.createObjectURL(file);
      selectedEngine = "parent-record";
      engineSelect.value = "parent-record";
      recordStatusText.textContent = `✅ 已匯入「${file.name}」作為第 ${currentPageIndex + 1} 頁語音！`;
      updateCacheHint();
    });

    testVoiceBtn.addEventListener("click", async () => {
      unlockAudioOnUserGesture();
      stopReading();
      const sampleLine = "咚、咚、咚！猜猜看，今天是誰要跟我們一起聽故事呀？";
      if (selectedEngine === "gemini-tts") {
        try {
          const ttsData = await fetchGeminiTtsPage(0, sampleLine);
          isReading = true;
          const mySession = ++readSessionId;
          const onTestEnd = () => { isReading = false; syncControlButtons(); };
          if (!playPcmViaWebAudio(ttsData, 0, mySession, onTestEnd)) {
            playAudioElementUrl(ttsData.wavBlobUrl, 0, mySession, onTestEnd);
          }
          return;
        } catch (e) {}
      }
      if (!("speechSynthesis" in window)) return;
      const utter = new SpeechSynthesisUtterance(sampleLine);
      window._activeBedtimeUtterance = utter;
      const v = getActiveVoice();
      if (v) {
        utter.voice = v;
        utter.lang = v.lang || "zh-TW";
      } else {
        utter.lang = "zh-TW";
      }
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    });

    // Init & immediately preload Page 1 and Page 2 so playback starts rapidly with a unified voice
    renderPage();
    preloadUpcomingPages(0);
